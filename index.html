// FS Market BD - Core React Application Controller
window.FS = window.FS || {};

(function () {
  const { useState, useEffect, useMemo } = React;
  const {
    INITIAL_PRODUCTS,
    INITIAL_ORDERS,
    Icons,
    ToastContainer,
    Navbar,
    Hero,
    CategoryFilter,
    ProductGrid,
    ProductModal,
    CartDrawer,
    CheckoutModal,
    WishlistDrawer,
    OrderTrackingModal,
    Footer,
    AdminLogin,
    AdminDashboard
  } = window.FS;

  function App() {
    // ----------------------------------------------------
    // State Initialization with LocalStorage Persistence
    // ----------------------------------------------------
    const [products, setProducts] = useState(() => {
      try {
        const saved = localStorage.getItem("fs_products_v1");
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      } catch (e) {
        return INITIAL_PRODUCTS;
      }
    });

    const [orders, setOrders] = useState(() => {
      try {
        const saved = localStorage.getItem("fs_orders_v1");
        return saved ? JSON.parse(saved) : INITIAL_ORDERS;
      } catch (e) {
        return INITIAL_ORDERS;
      }
    });

    const [cart, setCart] = useState(() => {
      try {
        const saved = localStorage.getItem("fs_cart_v1");
        return saved ? JSON.parse(saved) : [];
      } catch (e) {
        return [];
      }
    });

    const [wishlist, setWishlist] = useState(() => {
      try {
        const saved = localStorage.getItem("fs_wishlist_v1");
        return saved ? JSON.parse(saved) : [];
      } catch (e) {
        return [];
      }
    });

    const [currentUser, setCurrentUser] = useState(() => {
      try {
        const saved = localStorage.getItem("fs_admin_user_v1");
        return saved ? JSON.parse(saved) : null;
      } catch (e) {
        return null;
      }
    });

    // View State: 'storefront' or 'admin'
    const [currentView, setCurrentView] = useState("storefront");

    // Storefront Filters
    const [activeCategory, setActiveCategory] = useState("All Gadgets");
    const [searchQuery, setSearchQuery] = useState("");
    const [priceRange, setPriceRange] = useState(100000);
    const [inStockOnly, setInStockOnly] = useState(false);
    const [sortBy, setSortBy] = useState("featured");

    // Checkout & Cart settings
    const [shippingArea, setShippingArea] = useState("inside"); // 'inside' or 'outside'
    const [appliedCoupon, setAppliedCoupon] = useState(null);
    const [discountAmount, setDiscountAmount] = useState(0);

    // Modals & Drawers Visibility
    const [isCartOpen, setIsCartOpen] = useState(false);
    const [isWishlistOpen, setIsWishlistOpen] = useState(false);
    const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
    const [isTrackOrderOpen, setIsTrackOrderOpen] = useState(false);
    const [isAdminLoginOpen, setIsAdminLoginOpen] = useState(false);
    const [quickViewProduct, setQuickViewProduct] = useState(null);

    // Toast Notifications
    const [toasts, setToasts] = useState([]);

    // ----------------------------------------------------
    // Save to LocalStorage on updates
    // ----------------------------------------------------
    useEffect(() => {
      try {
        localStorage.setItem("fs_products_v1", JSON.stringify(products));
      } catch (e) { console.error(e); }
    }, [products]);

    useEffect(() => {
      try {
        localStorage.setItem("fs_orders_v1", JSON.stringify(orders));
      } catch (e) { console.error(e); }
    }, [orders]);

    useEffect(() => {
      try {
        localStorage.setItem("fs_cart_v1", JSON.stringify(cart));
      } catch (e) { console.error(e); }
    }, [cart]);

    useEffect(() => {
      try {
        localStorage.setItem("fs_wishlist_v1", JSON.stringify(wishlist));
      } catch (e) { console.error(e); }
    }, [wishlist]);

    useEffect(() => {
      try {
        if (currentUser) {
          localStorage.setItem("fs_admin_user_v1", JSON.stringify(currentUser));
        } else {
          localStorage.removeItem("fs_admin_user_v1");
        }
      } catch (e) { console.error(e); }
    }, [currentUser]);

    // ----------------------------------------------------
    // Toast Notification Dispatcher
    // ----------------------------------------------------
    const showToast = (title, message, type = "info") => {
      const id = Date.now() + Math.random();
      setToasts((prev) => [...prev, { id, title, message, type }]);

      setTimeout(() => {
        setToasts((prev) => prev.filter((t) => t.id !== id));
      }, 4000);
    };

    const removeToast = (id) => {
      setToasts((prev) => prev.filter((t) => t.id !== id));
    };

    // ----------------------------------------------------
    // Cart & Wishlist Operations
    // ----------------------------------------------------
    const handleAddToCart = (product, quantity = 1) => {
      if (product.stock <= 0) {
        showToast("Out of Stock", `${product.title} is currently unavailable.`, "error");
        return;
      }

      setCart((prev) => {
        const existing = prev.find((item) => item.id === product.id);
        if (existing) {
          const newQty = Math.min(product.stock, existing.quantity + quantity);
          showToast("Cart Updated", `Updated quantity for ${product.title}`, "success");
          return prev.map((item) =>
            item.id === product.id ? { ...item, quantity: newQty } : item
          );
        } else {
          showToast("Added to Cart", `${product.title} added to your bag`, "success");
          return [...prev, { ...product, quantity: Math.min(product.stock, quantity) }];
        }
      });
    };

    const handleUpdateQuantity = (id, newQty) => {
      if (newQty <= 0) {
        handleRemoveFromCart(id);
        return;
      }
      setCart((prev) =>
        prev.map((item) => (item.id === id ? { ...item, quantity: newQty } : item))
      );
    };

    const handleRemoveFromCart = (id) => {
      const item = cart.find((i) => i.id === id);
      setCart((prev) => prev.filter((i) => i.id !== id));
      if (item) {
        showToast("Removed", `${item.title} removed from cart`, "info");
      }
    };

    const handleClearCart = () => {
      setCart([]);
      setAppliedCoupon(null);
      setDiscountAmount(0);
      showToast("Cart Cleared", "All items removed from shopping cart", "info");
    };

    const handleToggleWishlist = (product) => {
      const exists = wishlist.some((item) => item.id === product.id);
      if (exists) {
        setWishlist((prev) => prev.filter((item) => item.id !== product.id));
        showToast("Removed from Wishlist", `${product.title} removed from saved list`, "info");
      } else {
        setWishlist((prev) => [...prev, product]);
        showToast("Saved to Wishlist", `${product.title} added to your favorites`, "success");
      }
    };

    const handleRemoveFromWishlist = (id) => {
      setWishlist((prev) => prev.filter((item) => item.id !== id));
    };

    const handleClearWishlist = () => {
      setWishlist([]);
    };

    // ----------------------------------------------------
    // Promo Voucher Codes
    // ----------------------------------------------------
    const handleApplyCoupon = (code) => {
      const clean = code.trim().toUpperCase();
      const subtotal = cart.reduce((acc, i) => acc + (i.price * i.quantity), 0);

      if (clean === "FSMARKET10") {
        const disc = Math.round(subtotal * 0.10);
        setAppliedCoupon("FSMARKET10");
        setDiscountAmount(disc);
        showToast("Promo Applied!", "10% VIP discount applied to your order", "success");
      } else if (clean === "TECHBD") {
        const disc = Math.min(subtotal, 300);
        setAppliedCoupon("TECHBD");
        setDiscountAmount(disc);
        showToast("Promo Applied!", "৳300 flat discount applied", "success");
      } else if (clean === "FREESHIP") {
        setAppliedCoupon("FREESHIP");
        setDiscountAmount(0);
        showToast("Free Shipping Applied!", "Zero delivery fee for this order", "success");
      } else {
        showToast("Invalid Coupon", "Coupon code not recognized. Try 'FSMARKET10'", "error");
      }
    };

    const handleRemoveCoupon = () => {
      setAppliedCoupon(null);
      setDiscountAmount(0);
      showToast("Coupon Removed", "Discount has been removed", "info");
    };

    // ----------------------------------------------------
    // Order Placement & Inventory Sync
    // ----------------------------------------------------
    const handleOrderPlaced = (newOrder) => {
      // 1. Decrement inventory stock
      setProducts((prev) =>
        prev.map((p) => {
          const ordered = newOrder.items.find((item) => item.id === p.id);
          if (ordered) {
            return {
              ...p,
              stock: Math.max(0, p.stock - ordered.quantity)
            };
          }
          return p;
        })
      );

      // 2. Prepend new order to orders database
      setOrders((prev) => [newOrder, ...prev]);

      // 3. Clear shopping cart
      setCart([]);
      setAppliedCoupon(null);
      setDiscountAmount(0);

      // 4. Show notification
      showToast(
        "Order Confirmed!",
        `Order ${newOrder.id} successfully placed. We're processing delivery.`,
        "success"
      );
    };

    // Instant Buy from Product Modal
    const handleBuyNow = (product, quantity = 1) => {
      handleAddToCart(product, quantity);
      setIsCheckoutOpen(true);
    };

    // ----------------------------------------------------
    // Admin CRUD Operations
    // ----------------------------------------------------
    const handleAddProduct = (newProduct) => {
      setProducts((prev) => [newProduct, ...prev]);
      showToast("Product Added", `${newProduct.title} added to store catalog`, "success");
    };

    const handleEditProduct = (updatedProduct) => {
      setProducts((prev) =>
        prev.map((p) => (p.id === updatedProduct.id ? updatedProduct : p))
      );
      showToast("Product Updated", `${updatedProduct.title} details updated`, "success");
    };

    const handleDeleteProduct = (productId) => {
      const prod = products.find((p) => p.id === productId);
      setProducts((prev) => prev.filter((p) => p.id !== productId));
      showToast("Product Deleted", `${prod?.title || 'Item'} removed from store`, "info");
    };

    const handleUpdateStock = (productId, newStock) => {
      setProducts((prev) =>
        prev.map((p) => (p.id === productId ? { ...p, stock: newStock } : p))
      );
      showToast("Stock Adjusted", `Inventory updated`, "success");
    };

    const handleUpdateOrderStatus = (orderId, newStatus) => {
      setOrders((prev) =>
        prev.map((o) => (o.id === orderId ? { ...o, status: newStatus } : o))
      );
      showToast("Order Updated", `Order ${orderId} status changed to ${newStatus}`, "success");
    };

    const handleDeleteOrder = (orderId) => {
      setOrders((prev) => prev.filter((o) => o.id !== orderId));
      showToast("Order Removed", `Order record ${orderId} deleted`, "info");
    };

    const handleResetDemoData = () => {
      setProducts(INITIAL_PRODUCTS);
      setOrders(INITIAL_ORDERS);
      localStorage.setItem("fs_products_v1", JSON.stringify(INITIAL_PRODUCTS));
      localStorage.setItem("fs_orders_v1", JSON.stringify(INITIAL_ORDERS));
      showToast("Demo Data Reset", "Store restored to default pristine state", "success");
    };

    // ----------------------------------------------------
    // Admin Auth
    // ----------------------------------------------------
    const handleAdminLoginSuccess = (user) => {
      setCurrentUser(user);
      setIsAdminLoginOpen(false);
      setCurrentView("admin");
      showToast("Welcome Admin", `Logged in as ${user.name}`, "success");
    };

    const handleAdminLogout = () => {
      setCurrentUser(null);
      setCurrentView("storefront");
      showToast("Logged Out", "Signed out of staff admin portal", "info");
    };

    const handleOpenAdminPortal = () => {
      if (currentUser) {
        setCurrentView("admin");
      } else {
        setIsAdminLoginOpen(true);
      }
    };

    // ----------------------------------------------------
    // Filtered & Sorted Storefront Catalog
    // ----------------------------------------------------
    const categories = [
      "All Gadgets",
      "Mobile Accessories",
      "Smartwatches",
      "Earbuds",
      "Chargers",
      "Tech Gadgets"
    ];

    const categoryCounts = useMemo(() => {
      const counts = {};
      products.forEach((p) => {
        counts[p.category] = (counts[p.category] || 0) + 1;
      });
      return counts;
    }, [products]);

    const filteredCatalog = useMemo(() => {
      return products
        .filter((p) => {
          const matchesCat = activeCategory === "All Gadgets" || p.category === activeCategory;
          const matchesSearch =
            p.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            p.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
            p.shortDesc?.toLowerCase().includes(searchQuery.toLowerCase());
          const matchesPrice = p.price <= priceRange;
          const matchesStock = !inStockOnly || p.stock > 0;

          return matchesCat && matchesSearch && matchesPrice && matchesStock;
        })
        .sort((a, b) => {
          if (sortBy === "price-asc") return a.price - b.price;
          if (sortBy === "price-desc") return b.price - a.price;
          if (sortBy === "rating") return b.rating - a.rating;
          if (sortBy === "stock") return b.stock - a.stock;
          return 0; // featured order
        });
    }, [products, activeCategory, searchQuery, priceRange, inStockOnly, sortBy]);

    // Cart calculations
    const cartCount = cart.reduce((acc, item) => acc + item.quantity, 0);
    const cartTotal = cart.reduce((acc, item) => acc + item.price * item.quantity, 0);

    return (
      <div className="relative min-h-screen bg-[#060913] text-slate-100 flex flex-col font-sans selection:bg-cyan-400 selection:text-slate-950">
        
        {/* Ambient Glowing Background Orbs */}
        <div className="liquid-ambient-bg">
          <div className="glow-orb orb-cyan"></div>
          <div className="glow-orb orb-purple"></div>
          <div className="glow-orb orb-pink"></div>
          <div className="glow-orb orb-emerald"></div>
        </div>

        {/* Subtle Cyber Grid */}
        <div className="cyber-grid-overlay"></div>

        {/* Toast Notifications */}
        <ToastContainer toasts={toasts} removeToast={removeToast} />

        {/* ====================================================
            VIEW 1: SECURE ADMIN DASHBOARD
           ==================================================== */}
        {currentView === "admin" && currentUser ? (
          <AdminDashboard
            currentUser={currentUser}
            onLogout={handleAdminLogout}
            onReturnToStorefront={() => setCurrentView("storefront")}
            products={products}
            orders={orders}
            onAddProduct={handleAddProduct}
            onEditProduct={handleEditProduct}
            onDeleteProduct={handleDeleteProduct}
            onUpdateStock={handleUpdateStock}
            onUpdateOrderStatus={handleUpdateOrderStatus}
            onDeleteOrder={handleDeleteOrder}
            onResetDemoData={handleResetDemoData}
          />
        ) : (
          /* ====================================================
              VIEW 2: CUSTOMER STOREFRONT
             ==================================================== */
          <div className="flex-1 flex flex-col relative z-10">
            {/* Header Navigation */}
            <Navbar
              cartCount={cartCount}
              cartTotal={cartTotal}
              wishlistCount={wishlist.length}
              onOpenCart={() => setIsCartOpen(true)}
              onOpenWishlist={() => setIsWishlistOpen(true)}
              onOpenTrackOrder={() => setIsTrackOrderOpen(true)}
              onOpenAdmin={handleOpenAdminPortal}
              searchQuery={searchQuery}
              setSearchQuery={setSearchQuery}
              products={products}
              onSelectProduct={(p) => setQuickViewProduct(p)}
              activeCategory={activeCategory}
              onSelectCategory={(cat) => setActiveCategory(cat)}
            />

            {/* Hero Section */}
            <Hero
              onExploreClick={() => {
                const el = document.getElementById("catalog-section");
                if (el) el.scrollIntoView({ behavior: "smooth" });
              }}
              onFeaturedQuickView={(p) => setQuickViewProduct(p)}
              onAddToCart={handleAddToCart}
              featuredProduct={products[0]}
            />

            {/* Product Catalog & Filtering Section */}
            <main id="catalog-section" className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full flex-1">
              <div className="mb-6">
                <div className="flex items-center gap-2 text-xs font-bold text-cyan-400 uppercase tracking-wider mb-1">
                  <Icons.Sparkles className="w-4 h-4" />
                  <span>PREMIUM GADGET COLLECTION</span>
                </div>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-white">
                  Trending Gear & Accessories
                </h2>
                <p className="text-xs sm:text-sm text-slate-400 mt-1">
                  Filter by category, price, and instant stock availability across Bangladesh.
                </p>
              </div>

              {/* Category Pills & Filters */}
              <CategoryFilter
                categories={categories}
                activeCategory={activeCategory}
                onSelectCategory={setActiveCategory}
                sortBy={sortBy}
                setSortBy={setSortBy}
                priceRange={priceRange}
                setPriceRange={setPriceRange}
                inStockOnly={inStockOnly}
                setInStockOnly={setInStockOnly}
                categoryCounts={categoryCounts}
                totalProductsCount={products.length}
              />

              {/* Product Grid */}
              <ProductGrid
                products={filteredCatalog}
                onAddToCart={handleAddToCart}
                onQuickView={(p) => setQuickViewProduct(p)}
                wishlist={wishlist}
                onToggleWishlist={handleToggleWishlist}
                onResetFilters={() => {
                  setActiveCategory("All Gadgets");
                  setSearchQuery("");
                  setPriceRange(100000);
                  setInStockOnly(false);
                  setSortBy("featured");
                }}
              />
            </main>

            {/* Footer */}
            <Footer
              onSelectCategory={setActiveCategory}
              onOpenTrackOrder={() => setIsTrackOrderOpen(true)}
              onOpenAdmin={handleOpenAdminPortal}
            />
          </div>
        )}

        {/* ====================================================
            MODALS AND DRAWERS
           ==================================================== */}
        {/* Product Quick View & Specs Modal */}
        <ProductModal
          product={quickViewProduct}
          onClose={() => setQuickViewProduct(null)}
          onAddToCart={handleAddToCart}
          onBuyNow={handleBuyNow}
          isWishlisted={quickViewProduct ? wishlist.some((i) => i.id === quickViewProduct.id) : false}
          onToggleWishlist={handleToggleWishlist}
        />

        {/* Slide-over Cart Drawer */}
        <CartDrawer
          isOpen={isCartOpen}
          onClose={() => setIsCartOpen(false)}
          cartItems={cart}
          onUpdateQuantity={handleUpdateQuantity}
          onRemoveItem={handleRemoveFromCart}
          onClearCart={handleClearCart}
          onProceedCheckout={() => setIsCheckoutOpen(true)}
          shippingArea={shippingArea}
          setShippingArea={setShippingArea}
          couponCode={appliedCoupon}
          setCouponCode={setAppliedCoupon}
          discountAmount={discountAmount}
          appliedCoupon={appliedCoupon}
          onApplyCoupon={handleApplyCoupon}
          onRemoveCoupon={handleRemoveCoupon}
        />

        {/* Slide-over Wishlist Drawer */}
        <WishlistDrawer
          isOpen={isWishlistOpen}
          onClose={() => setIsWishlistOpen(false)}
          wishlist={wishlist}
          onRemoveFromWishlist={handleRemoveFromWishlist}
          onAddToCart={handleAddToCart}
          onClearWishlist={handleClearWishlist}
        />

        {/* Checkout Modal */}
        <CheckoutModal
          isOpen={isCheckoutOpen}
          onClose={() => setIsCheckoutOpen(false)}
          cartItems={cart}
          shippingArea={shippingArea}
          discountAmount={discountAmount}
          appliedCoupon={appliedCoupon}
          onOrderPlaced={handleOrderPlaced}
        />

        {/* Customer Order Tracking Modal */}
        <OrderTrackingModal
          isOpen={isTrackOrderOpen}
          onClose={() => setIsTrackOrderOpen(false)}
          orders={orders}
        />

        {/* Admin Login Modal */}
        <AdminLogin
          isOpen={isAdminLoginOpen}
          onClose={() => setIsAdminLoginOpen(false)}
          onLoginSuccess={handleAdminLoginSuccess}
        />
      </div>
    );
  }

  // Mount React Root
  const container = document.getElementById("root");
  if (container) {
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  }
})();


  </script>
</body>
</html>
