};

window.FS = window.FS || {};

window.FS.CategoryFilter = function CategoryFilter({
  categories,
  activeCategory,
  onSelectCategory,
  sortBy,
  setSortBy,
  priceRange,
  setPriceRange,
  inStockOnly,
  setInStockOnly,
  categoryCounts,
  totalProductsCount
}) {
  const { Icons } = window.FS;
  const { useState } = React;
  const [showFilters, setShowFilters] = useState(false);

  const getCategoryIcon = (cat) => {
    switch (cat) {
      case "Smartwatches":
        return <Icons.Watch className="w-4 h-4" />;
      case "Earbuds":
        return <Icons.Headphones className="w-4 h-4" />;
      case "Chargers":
        return <Icons.BatteryCharging className="w-4 h-4" />;
      case "Mobile Accessories":
        return <Icons.Smartphone className="w-4 h-4" />;
      case "Tech Gadgets":
        return <Icons.Zap className="w-4 h-4" />;
      default:
        return <Icons.Layers className="w-4 h-4" />;
    }
  };

  return (
    <div className="space-y-6 mb-8">
      {/* Category Pills Bar */}
      <div className="flex items-center justify-between flex-wrap gap-4">
        <div className="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none max-w-full">
          {categories.map((cat) => {
            const isActive = activeCategory === cat;
            const count = cat === "All Gadgets" ? totalProductsCount : (categoryCounts[cat] || 0);

            return (
              <button
                key={cat}
                onClick={() => onSelectCategory(cat)}
                className={`flex items-center gap-2 px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-semibold whitespace-nowrap transition-all duration-300 ${
                  isActive
                    ? 'glass-pill-active scale-[1.02]'
                    : 'glass-pill text-slate-300 hover:text-white'
                }`}
              >
                <span className={isActive ? 'text-cyan-400' : 'text-slate-400'}>
                  {getCategoryIcon(cat)}
                </span>
                <span>{cat}</span>
                <span
                  className={`text-[10px] px-1.5 py-0.5 rounded-full ${
                    isActive ? 'bg-cyan-400 text-slate-950 font-extrabold' : 'bg-white/10 text-slate-400'
                  }`}
                >
                  {count}
                </span>
              </button>
            );
          })}
        </div>

        {/* Filter & Sort Toggle Button for Mobile/Tablet */}
        <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
          <button
            onClick={() => setShowFilters(!showFilters)}
            className="flex items-center gap-2 px-4 py-2.5 rounded-xl btn-glass-ghost text-xs font-semibold text-slate-200"
          >
            <Icons.SlidersHorizontal className="w-4 h-4 text-cyan-400" />
            <span>Filter & Sort {showFilters ? '▲' : '▼'}</span>
          </button>

          {/* Sort Selector Dropdown */}
          <div className="relative">
            <select
              value={sortBy}
              onChange={(e) => setSortBy(e.target.value)}
              className="appearance-none glass-input px-4 py-2.5 pr-8 rounded-xl text-xs font-medium text-slate-200 cursor-pointer focus:outline-none"
            >
              <option value="featured" className="bg-slate-900 text-white">Sort: Featured First</option>
              <option value="price-asc" className="bg-slate-900 text-white">Price: Low to High</option>
              <option value="price-desc" className="bg-slate-900 text-white">Price: High to Low</option>
              <option value="rating" className="bg-slate-900 text-white">Highest Customer Rating</option>
              <option value="stock" className="bg-slate-900 text-white">Most Stock Available</option>
            </select>
            <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 text-[10px]">
              ▼
            </div>
          </div>
        </div>
      </div>

      {/* Expandable Advanced Filter Drawer Panel */}
      {showFilters && (
        <div className="glass-panel p-5 rounded-2xl border border-white/10 animate-fade-in space-y-4">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
            
            {/* Price Range Slider */}
            <div>
              <div className="flex justify-between items-center text-xs font-semibold text-slate-300 mb-2">
                <span>Max Price Filter</span>
                <span className="text-cyan-400 font-mono font-bold">৳{priceRange.toLocaleString()} BDT</span>
              </div>
              <input
                type="range"
                min="3000"
                max="100000"
                step="1000"
                value={priceRange}
                onChange={(e) => setPriceRange(Number(e.target.value))}
                className="w-full accent-cyan-400 cursor-pointer h-2 bg-white/10 rounded-lg appearance-none"
              />
              <div className="flex justify-between text-[10px] text-slate-500 mt-1 font-mono">
                <span>৳3,000</span>
                <span>৳100,000</span>
              </div>
            </div>

            {/* In-Stock Only Toggle */}
            <div className="flex items-center gap-3">
              <label className="flex items-center gap-3 cursor-pointer group">
                <input
                  type="checkbox"
                  checked={inStockOnly}
                  onChange={(e) => setInStockOnly(e.target.checked)}
                  className="w-4 h-4 accent-cyan-400 rounded bg-white/10 border-white/20"
                />
                <div>
                  <div className="text-xs font-semibold text-white group-hover:text-cyan-300 transition-colors">
                    In Stock Items Only
                  </div>
                  <div className="text-[10px] text-slate-400">
                    Hide gadgets currently on back-order
                  </div>
                </div>
              </label>
            </div>

            {/* Quick Reset Filters */}
            <div className="flex justify-start md:justify-end">
              <button
                onClick={() => {
                  setPriceRange(100000);
                  setInStockOnly(false);
                  setSortBy('featured');
                  onSelectCategory('All Gadgets');
                }}
                className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-medium text-slate-400 hover:text-rose-400 bg-white/5 hover:bg-rose-500/10 border border-white/5 hover:border-rose-500/30 transition-all"
              >
                <Icons.RotateCcw className="w-3.5 h-3.5" />
                <span>Reset All Filters</span>
              </button>
            </div>

          </div>
        </div>
      )}
    </div>
  );
};


// --- SOURCE: ProductCard.js ---
// Storefront Product Card Component
window.FS = window.FS || {};

window.FS.ProductCard = function ProductCard({
  product,
  onAddToCart,
  onQuickView,
  isWishlisted,
  onToggleWishlist
}) {
  const { Icons } = window.FS;
  const { useState } = React;
  const [isAdding, setIsAdding] = useState(false);

  const discountPercent = product.originalPrice > product.price
    ? Math.round(((product.originalPrice - product.price) / product.originalPrice) * 100)
    : 0;

  const handleAdd = (e) => {
    e.stopPropagation();
    setIsAdding(true);
    onAddToCart(product);
    setTimeout(() => {
      setIsAdding(false);
    }, 700);
  };

  const isLowStock = product.stock <= 5;
  const isOutOfStock = product.stock <= 0;

  return (
    <div
      onClick={() => onQuickView(product)}
      className="glass-card rounded-2xl p-4 flex flex-col justify-between group cursor-pointer border border-white/10 hover:border-cyan-400/40 transition-all duration-300"
    >
      <div>
        {/* Top Card Bar: Badge & Wishlist Heart */}
        <div className="flex items-center justify-between gap-2 mb-3">
          <div className="flex items-center gap-1.5 flex-wrap">
            {product.badge && (
              <span className="text-[10px] font-extrabold tracking-wider uppercase px-2.5 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-400/30">
                {product.badge}
              </span>
            )}
            {discountPercent > 0 && (
              <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30">
                -{discountPercent}%
              </span>
            )}
          </div>

          <button
            onClick={(e) => {
              e.stopPropagation();
              onToggleWishlist(product);
            }}
            className={`p-2 rounded-xl transition-all duration-200 ${
              isWishlisted
                ? 'bg-rose-500/20 text-rose-400 border border-rose-500/40 scale-110'
                : 'bg-white/5 text-slate-400 hover:text-white hover:bg-white/10 border border-white/5'
            }`}
            title={isWishlisted ? "Remove from wishlist" : "Save to wishlist"}
          >
            <Icons.Heart filled={isWishlisted} className="w-4 h-4" />
          </button>
        </div>

        {/* Product Image Container with Hover Zoom & Quick Actions */}
        <div className="relative aspect-square rounded-xl overflow-hidden bg-slate-900/60 border border-white/5 mb-4 flex items-center justify-center p-3 group/img">
          <img
            src={product.image}
            alt={product.title}
            className="w-full h-full object-cover rounded-lg group-hover/img:scale-110 transition-transform duration-500"
            loading="lazy"
          />

          {/* Frosted Hover Overlay with Quick View Eye Button */}
          <div className="absolute inset-0 bg-slate-950/60 backdrop-blur-xs opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center gap-2">
            <button
              onClick={(e) => {
                e.stopPropagation();
                onQuickView(product);
              }}
              className="px-4 py-2 rounded-xl bg-white/15 hover:bg-cyan-400 hover:text-slate-950 text-white text-xs font-bold backdrop-blur-md border border-white/20 transition-all duration-200 flex items-center gap-1.5 shadow-lg"
            >
              <Icons.Eye className="w-3.5 h-3.5" />
              <span>Quick View</span>
            </button>
          </div>

          {/* Stock Tag on Image */}
          {isLowStock && !isOutOfStock && (
            <span className="absolute bottom-2 left-2 text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/80 text-black backdrop-blur-md">
              Only {product.stock} Left!
            </span>
          )}
          {isOutOfStock && (
            <span className="absolute inset-0 bg-black/70 backdrop-blur-xs flex items-center justify-center text-xs font-bold text-rose-400 tracking-wider uppercase">
              Out of Stock
            </span>
          )}
        </div>

        {/* Category & Star Rating */}
        <div className="flex items-center justify-between text-xs text-slate-400 mb-1.5">
          <span className="font-medium text-slate-400">{product.category}</span>
          <div className="flex items-center gap-1 text-amber-400">
            <Icons.Star className="w-3.5 h-3.5 fill-current" />
            <span className="font-semibold text-white">{product.rating}</span>
            <span className="text-[11px] text-slate-400">({product.reviewsCount})</span>
          </div>
        </div>

        {/* Title */}
        <h4 className="text-sm font-bold text-white group-hover:text-cyan-300 transition-colors line-clamp-2 mb-2 leading-snug">
          {product.title}
        </h4>

        {/* Short Specs preview */}
        <p className="text-[11px] text-slate-300 line-clamp-1 mb-3">
          {product.shortDesc}
        </p>
      </div>

      {/* Pricing & Add to Cart Action */}
      <div className="pt-3 border-t border-white/5 space-y-3">
        <div className="flex items-baseline justify-between">
          <div>
            <span className="text-lg font-extrabold text-cyan-400">৳{product.price.toLocaleString()}</span>
            {product.originalPrice > product.price && (
              <span className="text-xs text-slate-400 line-through ml-2">৳{product.originalPrice.toLocaleString()}</span>
            )}
          </div>
          <span className="text-[10px] font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">
            Stock: {product.stock}
          </span>
        </div>

        <button
          disabled={isOutOfStock}
          onClick={handleAdd}
          className={`w-full py-2.5 px-3 rounded-xl text-xs font-bold transition-all duration-200 flex items-center justify-center gap-2 shadow-md ${
            isOutOfStock
              ? 'bg-white/5 text-slate-500 cursor-not-allowed border border-white/5'
              : isAdding
              ? 'bg-emerald-500 text-slate-950 scale-95'
              : 'btn-liquid-cyan'
          }`}
        >
          {isAdding ? (
            <>
              <Icons.Check className="w-4 h-4 stroke-[3]" />
              <span>Added to Cart!</span>
            </>
          ) : (
            <>
              <Icons.ShoppingBag className="w-4 h-4 text-slate-950" />
              <span>Add to Cart</span>
            </>
          )}
        </button>
      </div>
    </div>
  );
};


// --- SOURCE: ProductGrid.js ---
// Storefront Product Grid
window.FS = window.FS || {};

window.FS.ProductGrid = function ProductGrid({
  products,
  onAddToCart,
  onQuickView,
  wishlist,
  onToggleWishlist,
  onResetFilters
}) {
  const { Icons, ProductCard } = window.FS;

  if (products.length === 0) {
    return (
      <div className="glass-panel p-12 text-center rounded-3xl border border-white/10 my-8 max-w-lg mx-auto animate-fade-in">
        <div className="w-16 h-16 mx-auto mb-4 rounded-2xl bg-cyan-500/10 text-cyan-400 flex items-center justify-center">
          <Icons.Search className="w-8 h-8" />
        </div>
        <h3 className="text-lg font-bold text-white mb-2">No Matching Gadgets Found</h3>
        <p className="text-xs text-slate-400 mb-6 leading-relaxed">
          We couldn't find any gadgets matching your active filter criteria or search query. Try broadening your price range or switching category.
        </p>
        <button
          onClick={onResetFilters}
          className="px-6 py-2.5 rounded-xl btn-liquid-cyan text-xs font-bold inline-flex items-center gap-2"
        >
          <Icons.RotateCcw className="w-4 h-4 text-slate-950" />
          <span>Reset All Filters</span>
        </button>
      </div>
    );
  }

  return (
    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      {products.map((product) => {
        const isWishlisted = wishlist.some(item => item.id === product.id);
        return (
          <ProductCard
            key={product.id}
            product={product}
            onAddToCart={onAddToCart}
            onQuickView={onQuickView}
            isWishlisted={isWishlisted}
            onToggleWishlist={onToggleWishlist}
          />
        );
      })}
    </div>
  );
};


// --- SOURCE: ProductModal.js ---
// Storefront Product Details Modal (Quick View & Deep Specs)
window.FS = window.FS || {};

window.FS.ProductModal = function ProductModal({
  product,
  onClose,
  onAddToCart,
  onBuyNow,
  isWishlisted,
  onToggleWishlist
}) {
  const { Icons } = window.FS;
  const { useState, useEffect } = React;

  if (!product) return null;

  const [activeImage, setActiveImage] = useState(product.image);
  const [quantity, setQuantity] = useState(1);
  const [activeTab, setActiveTab] = useState('specs'); // 'specs' or 'highlights'

  const gallery = product.gallery && product.gallery.length > 0
    ? product.gallery
    : [product.image];

  useEffect(() => {
    setActiveImage(product.image);
    setQuantity(1);
  }, [product]);

  // Handle ESC key
  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === 'Escape') onClose();
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [onClose]);

  const discountPercent = product.originalPrice > product.price
    ? Math.round(((product.originalPrice - product.price) / product.originalPrice) * 100)
    : 0;

  const handleIncrement = () => {
    if (quantity < product.stock) setQuantity(q => q + 1);
  };

  const handleDecrement = () => {
    if (quantity > 1) setQuantity(q => q - 1);
  };

  return (
    <div className="fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-md flex items-center justify-center p-4 sm:p-6 animate-fade-in">
      <div 
        className="relative w-full max-w-4xl glass-panel-deep rounded-3xl border border-white/15 p-6 sm:p-8 shadow-2xl animate-modal-pop overflow-hidden"
        onClick={(e) => e.stopPropagation()}
      >
        {/* Top Glow bar */}
        <div className="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-cyan-400 via-indigo-500 to-purple-500"></div>

        {/* Close Button */}
        <button
          onClick={onClose}
          className="absolute top-4 right-4 p-2 rounded-xl btn-glass-ghost text-slate-400 hover:text-white transition-colors z-20"
        >
          <Icons.X className="w-5 h-5" />
        </button>

        <div className="grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
          
          {/* Left Column: Image Gallery */}
          <div className="md:col-span-6 space-y-4">
            {/* Main Active Image with Zoom Frame */}
            <div className="relative aspect-square rounded-2xl overflow-hidden bg-slate-900/80 border border-white/10 flex items-center justify-center p-4">
              <img
                src={activeImage}
                alt={product.title}
                className="w-full h-full object-cover rounded-xl transition-all duration-300"
              />
              {product.badge && (
                <span className="absolute top-3 left-3 text-[10px] font-extrabold tracking-wider uppercase px-2.5 py-1 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-400/30 backdrop-blur-md">
                  {product.badge}
                </span>
              )}
            </div>

            {/* Thumbnail selector */}
            {gallery.length > 1 && (
              <div className="flex items-center gap-3 overflow-x-auto pb-1">
                {gallery.map((img, index) => (
                  <button
                    key={index}
                    onClick={() => setActiveImage(img)}
                    className={`relative w-16 h-16 rounded-xl overflow-hidden border-2 shrink-0 transition-all ${
                      activeImage === img
                        ? 'border-cyan-400 ring-2 ring-cyan-400/20 scale-105'
                        : 'border-white/10 opacity-60 hover:opacity-100'
                    }`}
                  >
                    <img src={img} alt="Thumbnail" className="w-full h-full object-cover" />
                  </button>
                ))}
              </div>
            )}

            {/* Guarantee Pills */}
            <div className="grid grid-cols-2 gap-3 pt-2">
              <div className="flex items-center gap-2 p-2.5 rounded-xl bg-white/[0.02] border border-white/5 text-xs text-slate-300">
                <Icons.ShieldCheck className="w-4 h-4 text-cyan-400 shrink-0" />
                <span>100% Brand Authentic</span>
              </div>
              <div className="flex items-center gap-2 p-2.5 rounded-xl bg-white/[0.02] border border-white/5 text-xs text-slate-300">
                <Icons.Truck className="w-4 h-4 text-emerald-400 shrink-0" />
                <span>Express Doorstep Shipping</span>
              </div>
            </div>
          </div>

          {/* Right Column: Details, Specs & Actions */}
          <div className="md:col-span-6 space-y-5">
            {/* Category & Rating */}
            <div className="flex items-center justify-between text-xs text-slate-400">
              <span className="font-semibold text-cyan-400 uppercase tracking-wider">{product.category}</span>
              <div className="flex items-center gap-1.5 text-amber-400">
                <Icons.Star className="w-4 h-4 fill-current" />
                <span className="font-bold text-white text-sm">{product.rating}</span>
                <span className="text-slate-400">({product.reviewsCount} verified reviews)</span>
              </div>
            </div>

            {/* Title */}
            <h2 className="text-xl sm:text-2xl font-extrabold text-white leading-tight">
              {product.title}
            </h2>

            {/* Price block */}
            <div className="flex items-baseline gap-3">
              <span className="text-3xl font-extrabold text-cyan-400">৳{product.price.toLocaleString()}</span>
              {product.originalPrice > product.price && (
                <span className="text-base text-slate-500 line-through">৳{product.originalPrice.toLocaleString()}</span>
              )}
              {discountPercent > 0 && (
                <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30">
                  Save {discountPercent}%
                </span>
              )}
            </div>

            {/* Stock Meter */}
            <div className="space-y-1.5">
              <div className="flex justify-between items-center text-xs">
                <span className="text-slate-300 font-medium">Availability:</span>
                <span className={`font-semibold ${product.stock > 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                  {product.stock > 0 ? `In Stock (${product.stock} units left)` : 'Currently Out of Stock'}
                </span>
              </div>
              <div className="w-full h-1.5 stock-bar-track">
                <div 
                  className="h-full stock-bar-fill" 
                  style={{ width: `${Math.min(100, (product.stock / 30) * 100)}%` }}
                ></div>
              </div>
            </div>

            {/* Description */}
            <p className="text-xs text-slate-300 leading-relaxed">
              {product.shortDesc}
            </p>

            {/* Tabs: Specifications & Key Highlights */}
            <div className="border border-white/10 rounded-2xl overflow-hidden bg-black/20">
              <div className="flex border-b border-white/10 text-xs font-semibold">
                <button
                  onClick={() => setActiveTab('specs')}
                  className={`flex-1 py-2.5 text-center transition-colors ${
                    activeTab === 'specs'
                      ? 'bg-white/10 text-cyan-400 border-b-2 border-cyan-400'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Tech Specifications
                </button>
                <button
                  onClick={() => setActiveTab('highlights')}
                  className={`flex-1 py-2.5 text-center transition-colors ${
                    activeTab === 'highlights'
                      ? 'bg-white/10 text-cyan-400 border-b-2 border-cyan-400'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Key Highlights
                </button>
              </div>

              <div className="p-3 text-xs max-h-48 overflow-y-auto">
                {activeTab === 'specs' ? (
                  <div className="space-y-2">
                    {product.specs && Object.entries(product.specs).map(([key, val]) => (
                      <div key={key} className="flex justify-between items-center py-1 border-b border-white/5 last:border-none">
                        <span className="text-slate-400">{key}</span>
                        <span className="text-white font-medium text-right">{val}</span>
                      </div>
                    ))}
                  </div>
                ) : (
                  <ul className="space-y-2">
                    {product.highlights && product.highlights.map((h, i) => (
                      <li key={i} className="flex items-start gap-2 text-slate-300">
                        <span className="text-cyan-400 mt-0.5">•</span>
                        <span>{h}</span>
                      </li>
                    ))}
                  </ul>
                )}
              </div>
            </div>

            {/* Quantity Selector & Purchase Buttons */}
            <div className="space-y-3 pt-2">
              <div className="flex items-center gap-4">
                <div className="flex items-center rounded-xl glass-input px-2 py-1">
                  <button
                    onClick={handleDecrement}
                    disabled={quantity <= 1}
                    className="p-1.5 text-slate-400 hover:text-white disabled:opacity-30"
                  >
                    <Icons.Minus className="w-3.5 h-3.5" />
                  </button>
                  <span className="w-10 text-center font-bold text-sm text-white font-mono">{quantity}</span>
                  <button
                    onClick={handleIncrement}
                    disabled={quantity >= product.stock}
                    className="p-1.5 text-slate-400 hover:text-white disabled:opacity-30"
                  >
                    <Icons.Plus className="w-3.5 h-3.5" />
                  </button>
                </div>

                <button
                  onClick={() => onToggleWishlist(product)}
                  className={`p-3 rounded-xl border transition-colors ${
                    isWishlisted
                      ? 'bg-rose-500/20 text-rose-400 border-rose-500/40'
                      : 'btn-glass-ghost text-slate-400 hover:text-white'
                  }`}
                  title={isWishlisted ? "In Wishlist" : "Add to Wishlist"}
                >
                  <Icons.Heart filled={isWishlisted} className="w-5 h-5" />
                </button>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <button
                  onClick={() => {
                    onAddToCart(product, quantity);
                    onClose();
                  }}
                  disabled={product.stock <= 0}
                  className="py-3 px-4 rounded-xl btn-liquid-cyan text-xs font-bold flex items-center justify-center gap-2 shadow-lg"
                >
                  <Icons.ShoppingBag className="w-4 h-4 text-slate-950" />
                  <span>Add to Cart</span>
                </button>

                <button
                  onClick={() => {
                    onBuyNow(product, quantity);
                    onClose();
                  }}
                  disabled={product.stock <= 0}
                  className="py-3 px-4 rounded-xl btn-liquid-purple text-xs font-bold flex items-center justify-center gap-2 shadow-lg"
                >
                  <Icons.Zap className="w-4 h-4 text-white" />
                  <span>Instant Checkout</span>
                </button>
              </div>
            </div>

          </div>

        </div>
      </div>
    </div>
  );
};

// Storefront Slide-Over Cart Drawer
window.FS = window.FS || {};

window.FS.CartDrawer = function CartDrawer({
  isOpen,
  onClose,
  cartItems,
  onUpdateQuantity,
  onRemoveItem,
  onClearCart,
  onProceedCheckout,
  shippingArea,
  setShippingArea,

  // Handle ESC
  useEffect(() => {

      if (e.key === 'Escape') onClose();
    };
    if (isOpen) {
      window.addEventListener('keydown', handleKeyDown);
    }
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [isOpen, onClose]);

  if (!isOpen) return null;

  const subtotal = cartItems.reduce((acc, item) => acc + (item.price * item.quantity), 0);
  
  // Free delivery above 50,000 BDT or coupon FREESHIP
  const isFreeDelivery = subtotal >= 50000 || appliedCoupon === 'FREESHIP';
  const shippingFee = cartItems.length === 0 ? 0 : (isFreeDelivery ? 0 : (shippingArea === 'inside' ? 60 : 120));
  const grandTotal = Math.max(0, subtotal + shippingFee - discountAmount);

  return (
    <div className="fixed inset-0 z-50 overflow-hidden bg-black/80 backdrop-blur-md animate-fade-in flex justify-end">
      {/* Click outside to close */}
      <div className="absolute inset-0" onClick={onClose}></div>

      <div className="relative w-full max-w-md h-full glass-panel-deep border-l border-white/15 flex flex-col justify-between shadow-2xl animate-slide-right z-10 overflow-hidden">
        
        {/* Drawer Header */}
        <div className="p-5 border-b border-white/10 flex items-center justify-between">

                className="text-xs text-slate-400 hover:text-rose-400 transition-colors p-1"
                title="Empty cart"
              >
                Clear
              </button>
            )}
            <button

        {/* Cart Items List */}

              </div>
              <div className="space-y-1">
                <h4 className="text-base font-bold text-white">Your cart is empty</h4>

                </p>

                <Icons.ArrowLeft className="w-4 h-4 text-slate-950" />

              </button>
            </div>
          ) : (
            cartItems.map((item) => (
              <div
                key={item.id}
                className="glass-panel p-3.5 rounded-2xl border border-white/5 flex gap-3.5 items-center group"
              >
                <img

                    <div className="flex items-center rounded-lg bg-black/40 border border-white/10 px-1.5 py-0.5">

                        <Icons.Minus className="w-3 h-3" />

                      <span className="w-7 text-center font-mono text-xs text-white font-bold">
                        {item.quantity}
                      </span>
                      <button
                        onClick={() => onUpdateQuantity(item.id, item.quantity + 1)}

                        className="p-1 text-slate-400 hover:text-white disabled:opacity-30"

                        <Icons.Plus className="w-3 h-3" />

                      : 'bg-white/5 text-slate-400 border-white/5'
                  }`}
                >
                  Inside Dhaka (৳60)
                </button>
                <button
                  type="button"
                  onClick={() => setShippingArea('outside')}
                  className={`py-2 px-3 rounded-xl text-xs font-medium border text-center transition-all ${
                    shippingArea === 'outside'
                      ? 'bg-cyan-500/20 text-cyan-300 border-cyan-400/50 font-bold'
                      : 'bg-white/5 text-slate-400 border-white/5'
                  }`}
                >
                  Outside Dhaka (৳120)
                </button>
              </div>
            </div>

            {/* Promo Voucher Code */}
            <div className="space-y-1.5">
              <div className="flex gap-2">
                <input
                  type="text"
                  placeholder="Promo code (e.g. FSMARKET10)"
                  value={promoInput}
                  onChange={(e) => setPromoInput(e.target.value.toUpperCase())}
                  className="flex-1 px-3 py-2 text-xs rounded-xl glass-input uppercase font-mono"
                />
                <button
                  onClick={() => {
                    onApplyCoupon(promoInput);
                    setPromoInput("");
                  }}
                  className="px-4 py-2 rounded-xl btn-glass-ghost text-xs font-bold text-cyan-400 hover:border-cyan-400"
                >
                  Apply
                </button>
              </div>

              {appliedCoupon && (
                <div className="flex items-center justify-between text-[11px] text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-lg border border-emerald-500/20">
                  <span>Coupon <strong>{appliedCoupon}</strong> active (-৳{discountAmount.toLocaleString()})</span>
                  <button onClick={onRemoveCoupon} className="text-slate-400 hover:text-white">✕</button>
                </div>
              )}
            </div>

            {/* Price Calculations Breakdown */}
            <div className="space-y-1.5 text-xs pt-1 border-t border-white/5 font-medium">
              <div className="flex justify-between text-slate-300">
                <span>Subtotal</span>
                <span className="font-mono text-white">৳{subtotal.toLocaleString()}</span>
              </div>

              <div className="flex justify-between text-slate-300">
                <span>Shipping Fee</span>
                <span className="font-mono text-white">
                  {isFreeDelivery ? <span className="text-emerald-400">FREE</span> : `৳${shippingFee.toLocaleString()}`}
                </span>
              </div>

              {discountAmount > 0 && (
                <div className="flex justify-between text-emerald-400">
                  <span>Discount</span>
                  <span className="font-mono">-৳{discountAmount.toLocaleString()}</span>

                <span>Estimated Total</span>
                <span className="text-cyan-400 font-mono text-base">৳{grandTotal.toLocaleString()} BDT</span>
              </div>
            </div>

            {/* Checkout Action Button */}
            <button
              onClick={() => {
                onClose();
                onProceedCheckout();
              }}
              className="w-full py-3.5 rounded-xl btn-liquid-cyan text-xs font-bold tracking-wider uppercase flex items-center justify-center gap-2 shadow-xl"
            >
              <span>Proceed to Checkout</span>
              <Icons.ArrowRight className="w-4 h-4 text-slate-950" />
            </button>

          </div>
        )}

      </div>
    </div>
  );
};


// --- SOURCE: CheckoutModal.js ---
// Storefront Interactive Checkout Modal & Order Placement
window.FS = window.FS || {};

window.FS.CheckoutModal = function CheckoutModal({
  isOpen,
  onClose,
  cartItems,
  shippingArea,
  discountAmount,
  appliedCoupon,
  onOrderPlaced
}) {
  const { Icons } = window.FS;
  const { useState, useEffect } = React;

  if (!isOpen) return null;

  const [formData, setFormData] = useState({
    name: "",
    phone: "",
    email: "",
    address: "",
    city: shippingArea === 'inside' ? "Dhaka" : "Chattogram",
    notes: "",
    paymentMethod: "Cash on Delivery",
    trxId: ""
  });

  const [errors, setErrors] = useState({});
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [placedOrder, setPlacedOrder] = useState(null);

  // Subtotal and Grand Total
  const subtotal = cartItems.reduce((acc, item) => acc + (item.price * item.quantity), 0);
  const isFreeDelivery = subtotal >= 50000 || appliedCoupon === 'FREESHIP';
  const shippingFee = cartItems.length === 0 ? 0 : (isFreeDelivery ? 0 : (formData.city.toLowerCase() === 'dhaka' ? 60 : 120));
  const grandTotal = Math.max(0, subtotal + shippingFee - discountAmount);

  const validateForm = () => {
    const errs = {};
    if (!formData.name.trim()) errs.name = "Full name is required";
    
    // Bangladeshi phone number validation
    const cleanPhone = formData.phone.replace(/[\s-]/g, '');
    if (!cleanPhone) {
      errs.phone = "Phone number is required";
    } else if (!/^(?:\+?88)?01[3-9]\d{8}$/.test(cleanPhone)) {
      errs.phone = "Please enter a valid 11-digit Bangladeshi mobile number (01XXXXXXXXX)";
    }

    if (!formData.address.trim()) errs.address = "Complete delivery address is required";
    if (!formData.city.trim()) errs.city = "City is required";

    if (formData.paymentMethod === 'bKash / Nagad' && !formData.trxId.trim()) {
      errs.trxId = "Transaction ID is required for bKash/Nagad verification";
    }

    setErrors(errs);
    return Object.keys(errs).length === 0;
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!validateForm()) return;

    setIsSubmitting(true);

    setTimeout(() => {
      // Generate unique Order ID
      const randomNum = Math.floor(10000 + Math.random() * 90000);
      const newOrderId = `FS-${randomNum}`;
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const newOrder = {
        id: newOrderId,
        date: dateStr,
        customer: {
          name: formData.name,
          phone: formData.phone,
          email: formData.email || "customer@fsmarketbd.com",
          address: formData.address,
          city: formData.city,
          notes: formData.notes
        },
        items: cartItems.map(item => ({
          id: item.id,
          title: item.title,
          price: item.price,
          quantity: item.quantity,
          image: item.image
        })),
        subtotal: subtotal,
        shippingFee: shippingFee,
        discount: discountAmount,
        total: grandTotal,
        paymentMethod: formData.paymentMethod,
        paymentStatus: formData.paymentMethod === 'Cash on Delivery' ? 'Pending COD' : `Paid (TrxID: ${formData.trxId})`,
        status: "Pending"
      };

      // Trigger Confetti
      if (window.confetti) {
        window.confetti({
          particleCount: 130,
          spread: 80,
          origin: { y: 0.6 }
        });
      }

      setPlacedOrder(newOrder);
      setIsSubmitting(false);
      onOrderPlaced(newOrder);
    }, 900);
  };

  const handlePrint = () => {
    window.print();
  };

  return (
    <div className="fixed inset-0 z-50 overflow-y-auto bg-black/85 backdrop-blur-md flex items-center justify-center p-4 sm:p-6 animate-fade-in">
      <div 
        className="relative w-full max-w-2xl glass-panel-deep rounded-3xl border border-white/15 p-6 sm:p-8 shadow-2xl animate-modal-pop overflow-hidden"
        onClick={(e) => e.stopPropagation()}
      >
        <div className="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-cyan-400 via-indigo-500 to-purple-500"></div>

        {/* Close Button */}
        <button
          onClick={onClose}
          className="absolute top-4 right-4 p-2 rounded-xl btn-glass-ghost text-slate-400 hover:text-white transition-colors"
        >
          <Icons.X className="w-5 h-5" />
        </button>

        {/* View Mode: Success Confirmation Invoice OR Checkout Form */}
        {placedOrder ? (
          <div className="text-center py-4 space-y-6 animate-fade-in printable-invoice">
            {/* Success Icon */}
            <div className="w-16 h-16 rounded-2xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center mx-auto shadow-lg shadow-emerald-500/20 animate-pulse">
              <Icons.Check className="w-9 h-9 stroke-[3]" />
            </div>

            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-cyan-400">Order Placed Successfully!</span>
              <h3 className="text-2xl font-extrabold text-white mt-1">Thank You, {placedOrder.customer.name}!</h3>
              <p className="text-xs text-slate-400 mt-1">
                Your order is being prepared. You can track this order anytime with your ID.
              </p>
            </div>

            {/* Official Order Summary Card */}
            <div className="glass-panel p-5 rounded-2xl border border-white/10 text-left space-y-4">
              <div className="flex flex-wrap justify-between items-center pb-3 border-b border-white/10 gap-2">
                <div>
                  <div className="text-[10px] text-slate-400 uppercase tracking-wider">Order Reference</div>
                  <div className="text-base font-mono font-bold text-cyan-400">{placedOrder.id}</div>
                </div>
                <div>
                  <div className="text-[10px] text-slate-400 uppercase tracking-wider">Date & Time</div>
                  <div className="text-xs font-mono text-slate-200">{placedOrder.date}</div>
                </div>
                <div>
                  <div className="text-[10px] text-slate-400 uppercase tracking-wider">Payment Mode</div>
                  <div className="text-xs font-semibold text-emerald-400">{placedOrder.paymentMethod}</div>
                </div>
              </div>

              {/* Delivery Details */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                <div>
                  <span className="text-slate-400">Shipping Address:</span>
                  <p className="text-white font-medium mt-0.5">{placedOrder.customer.address}, {placedOrder.customer.city}</p>
                </div>
                <div>
                  <span className="text-slate-400">Contact Number:</span>
                  <p className="text-white font-medium mt-0.5">{placedOrder.customer.phone}</p>
                </div>
              </div>

              {/* Items List */}
              <div className="pt-2 border-t border-white/10 space-y-2">
                <span className="text-xs font-bold text-slate-300">Ordered Gadgets ({placedOrder.items.length}):</span>
                {placedOrder.items.map((it, idx) => (
                  <div key={idx} className="flex justify-between items-center text-xs">
                    <span className="text-slate-300 truncate max-w-xs">{it.title} × {it.quantity}</span>
                    <span className="font-mono text-white">৳{(it.price * it.quantity).toLocaleString()}</span>
                  </div>
                ))}
              </div>

              {/* Total Calculation */}
              <div className="pt-3 border-t border-white/10 flex justify-between items-baseline font-extrabold text-sm text-white">
                <span>Grand Total to Pay:</span>
                <span className="text-cyan-400 text-lg font-mono">৳{placedOrder.total.toLocaleString()} BDT</span>
              </div>
            </div>

            {/* Post-order Actions */}
            <div className="flex flex-wrap items-center justify-center gap-3 no-print">
              <button
                onClick={handlePrint}
                className="px-5 py-2.5 rounded-xl btn-glass-ghost text-xs font-bold flex items-center gap-2"
              >
                <Icons.Printer className="w-4 h-4 text-cyan-400" />
                <span>Print Invoice</span>
              </button>

              <button
                onClick={onClose}
                className="px-6 py-2.5 rounded-xl btn-liquid-cyan text-xs font-bold flex items-center gap-2"
              >
                <span>Continue Shopping</span>
                <Icons.ArrowRight className="w-4 h-4 text-slate-950" />
              </button>
            </div>
          </div>
        ) : (
          /* Checkout Input Form */
          <form onSubmit={handleSubmit} className="space-y-6">
            <div>
              <div className="flex items-center gap-2 text-cyan-400 text-xs font-bold uppercase tracking-wider">
                <Icons.ShieldCheck className="w-4 h-4" />
                <span>Encrypted Safe Checkout</span>
              </div>
              <h3 className="text-xl font-bold text-white mt-1">Delivery & Payment Information</h3>
              <p className="text-xs text-slate-400">Complete your delivery address across Bangladesh</p>
            </div>

            {/* Customer Information Inputs */}
            <div className="space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {/* Full Name */}
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">
                    Customer Name <span className="text-rose-400">*</span>
                  </label>
                  <input
                    type="text"
                    placeholder="e.g. Tanvir Ahmed"
                    value={formData.name}
                    onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                    className={`w-full px-3.5 py-2.5 rounded-xl glass-input text-xs ${errors.name ? 'border-rose-500' : ''}`}
                  />
                  {errors.name && <p className="text-[11px] text-rose-400 mt-1">{errors.name}</p>}
                </div>

                {/* Mobile Phone Number */}
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">
                    Mobile Number <span className="text-rose-400">*</span>
                  </label>
                  <input
                    type="tel"
                    placeholder="01XXXXXXXXX"
                    value={formData.phone}
                    onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                    className={`w-full px-3.5 py-2.5 rounded-xl glass-input text-xs font-mono ${errors.phone ? 'border-rose-500' : ''}`}
                  />
                  {errors.phone && <p className="text-[11px] text-rose-400 mt-1">{errors.phone}</p>}
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {/* Email Address */}
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">

// Storefront Customer Order Tracking Modal
window.FS = window.FS || {};

window.FS.OrderTrackingModal = function OrderTrackingModal({ isOpen, onClose, orders }) {
  const { Icons } = window.FS;
  const { useState } = React;

  if (!isOpen) return null;

  const [query, setQuery] = useState("");
  const [searchedOrder, setSearchedOrder] = useState(null);
  const [hasSearched, setHasSearched] = useState(false);

  const handleSearch = (e) => {
    e.preventDefault();
    if (!query.trim()) return;

    const clean = query.trim().toLowerCase().replace('#', '');
    const found = orders.find(o => 
      o.id.toLowerCase().replace('#', '') === clean ||
      o.customer.phone.replace(/[\s-]/g, '').includes(clean)
    );

    setSearchedOrder(found || null);
    setHasSearched(true);
  };

  const getStatusStep = (status) => {
    switch (status) {
      case 'Pending': return 1;
      case 'Processing': return 2;
      case 'Completed': return 4;
      case 'Cancelled': return -1;
      default: return 1;
    }
  };

  const currentStep = searchedOrder ? getStatusStep(searchedOrder.status) : 1;

  return (
    <div className="fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-md flex items-center justify-center p-4 sm:p-6 animate-fade-in">
      <div 
        className="relative w-full max-w-xl glass-panel-deep rounded-3xl border border-white/15 p-6 sm:p-8 shadow-2xl animate-modal-pop overflow-hidden"
        onClick={(e) => e.stopPropagation()}
      >
        <div className="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-cyan-400 via-indigo-500 to-purple-500"></div>

        <button
          onClick={onClose}
          className="absolute top-4 right-4 p-2 rounded-xl btn-glass-ghost text-slate-400 hover:text-white"
        >
          <Icons.X className="w-5 h-5" />
        </button>

        <div className="space-y-6">
          <div className="text-center">
            <div className="w-12 h-12 rounded-2xl bg-cyan-500/10 text-cyan-400 flex items-center justify-center mx-auto mb-3">
              <Icons.Truck className="w-6 h-6" />
            </div>
            <h3 className="text-xl font-bold text-white">Track Your Order Status</h3>
            <p className="text-xs text-slate-400 mt-1">
              Enter your Order Reference ID (e.g. FS-84920) or Customer Mobile Number
            </p>
          </div>

          {/* Search Form */}
          <form onSubmit={handleSearch} className="flex gap-2">
            <input
              type="text"
              placeholder="e.g. FS-84920 or 01712-345678"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              className="flex-1 px-4 py-2.5 rounded-xl glass-input text-xs font-mono"
            />
            <button
              type="submit"
              className="px-5 py-2.5 rounded-xl btn-liquid-cyan text-xs font-bold"
            >
              Track
            </button>
          </form>

          {/* Search Results */}
          {hasSearched && (
            searchedOrder ? (
              <div className="glass-panel p-5 rounded-2xl border border-white/10 space-y-5 animate-fade-in">
                <div className="flex justify-between items-center pb-3 border-b border-white/10">
                  <div>
                    <span className="text-[10px] text-slate-400 uppercase tracking-wider">Order ID</span>
                    <h4 className="text-base font-bold font-mono text-cyan-400">{searchedOrder.id}</h4>
                  </div>
                  <div className="text-right">
                    <span className="text-[10px] text-slate-400 uppercase tracking-wider">Current Status</span>
                    <div className={`text-xs font-bold px-2.5 py-0.5 rounded-full mt-0.5 ${
                      searchedOrder.status === 'Completed' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' :
                      searchedOrder.status === 'Processing' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' :
                      searchedOrder.status === 'Cancelled' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' :
                      'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                    }`}>
                      {searchedOrder.status}
                    </div>
                  </div>
                </div>

                {/* Progress Stepper (if not cancelled) */}
                {searchedOrder.status !== 'Cancelled' ? (
                  <div className="space-y-2">
                    <div className="grid grid-cols-4 text-center text-[10px] font-semibold text-slate-400">
                      <span className={currentStep >= 1 ? 'text-cyan-400' : ''}>Placed</span>
                      <span className={currentStep >= 2 ? 'text-cyan-400' : ''}>Processing</span>
                      <span className={currentStep >= 3 ? 'text-cyan-400' : ''}>On The Way</span>
                      <span className={currentStep >= 4 ? 'text-emerald-400' : ''}>Delivered</span>
                    </div>

                    <div className="w-full h-2 bg-white/10 rounded-full overflow-hidden flex">
                      <div
                        className="h-full bg-gradient-to-r from-cyan-400 to-emerald-400 transition-all duration-500"
                        style={{ width: `${(Math.max(1, currentStep) / 4) * 100}%` }}
                      ></div>
                    </div>
                  </div>
                ) : (
                  <div className="p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-xs text-rose-300">
                    This order was cancelled. If you have questions, please call our hotline +880 1712-345678.
                  </div>
                )}

                {/* Summary Info */}
                <div className="grid grid-cols-2 gap-3 text-xs pt-2 border-t border-white/5">
                  <div>
                    <span className="text-slate-400">Customer:</span>
                    <p className="text-white font-medium">{searchedOrder.customer.name}</p>
                  </div>
                  <div>
                    <span className="text-slate-400">Destination:</span>
                    <p className="text-white font-medium">{searchedOrder.customer.city}</p>
                  </div>
                  <div>
                    <span className="text-slate-400">Total Amount:</span>
                    <p className="text-cyan-400 font-bold font-mono">৳{searchedOrder.total.toLocaleString()}</p>
                  </div>
                  <div>
                    <span className="text-slate-400">Payment:</span>
                    <p className="text-white font-medium">{searchedOrder.paymentMethod}</p>
                  </div>
                </div>

                {/* Ordered Items Preview */}
                <div className="space-y-1.5 pt-2 border-t border-white/5">
                  <span className="text-[11px] text-slate-400 font-semibold">Items in this Package:</span>
                  {searchedOrder.items.map((it, idx) => (
                    <div key={idx} className="flex justify-between text-xs text-slate-300">
                      <span className="truncate max-w-xs">{it.title}</span>
                      <span className="font-mono text-white">Qty: {it.quantity}</span>
                    </div>
                  ))}
                </div>
              </div>
            ) : (
              <div className="text-center p-6 glass-panel rounded-2xl border border-white/10 space-y-2">
                <Icons.AlertTriangle className="w-8 h-8 text-amber-400 mx-auto" />
                <h4 className="text-sm font-bold text-white">No Order Found</h4>
                <p className="text-xs text-slate-400">
                  We couldn't locate any order matching "<strong>{query}</strong>". Please verify your Order ID or phone number.
                </p>
              </div>
            )
          )}

          {/* Quick Demo Orders Pills */}
          <div className="pt-2 border-t border-white/10 text-xs text-slate-400 space-y-1.5">
            <span>Quick test lookup IDs:</span>
            <div className="flex flex-wrap gap-2">
              {['FS-84920', 'FS-84919', 'FS-84918'].map(id => (
                <button
                  key={id}
                  onClick={() => {
                    setQuery(id);
                    const found = orders.find(o => o.id === id);
                    setSearchedOrder(found || null);
                    setHasSearched(true);
                  }}
                  className="px-2 py-1 rounded-md bg-white/5 hover:bg-cyan-500/20 text-cyan-300 font-mono text-[11px] border border-white/10 transition-colors"
                >
                  {id}
                </button>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

// Admin Product Management (Full CRUD)
window.FS = window.FS || {};

window.FS.ProductCRUD = function ProductCRUD({
  products,
  onAddProduct,
  onEditProduct,
  onDeleteProduct,
  onUpdateStock
}) {
  const { Icons } = window.FS;
  const { useState } = React;

  const [searchFilter, setSearchFilter] = useState("");
  const [categoryFilter, setCategoryFilter] = useState("All");
  
  // Modals state
  const [isAddModalOpen, setIsAddModalOpen] = useState(false);
  const [editingProduct, setEditingProduct] = useState(null);
  const [deletingProductId, setDeletingProductId] = useState(null);

  // Form State for Add / Edit
  const defaultForm = {
    title: "",
    category: "Smartwatches",
    price: "",
    originalPrice: "",
    stock: "",
    badge: "NEW ARRIVAL",
    image: "https://images.unsplash.com/photo-1579586337278-3befd40fd17a?auto=format&fit=crop&w=800&q=80",
    shortDesc: "",
    specsStr: "Display: AMOLED, Battery: 48h, Warranty: 1 Year Official",
    highlightsStr: "Premium aerospace materials, Fast wireless charging, Precision sensors"
  };

  const [formData, setFormData] = useState(defaultForm);
  const [formErrors, setFormErrors] = useState({});

  // Preset gadget images for quick image selection
  const imagePresets = [
    { label: "Smartwatch", url: "https://images.unsplash.com/photo-1579586337278-3befd40fd17a?auto=format&fit=crop&w=800&q=80" },
    { label: "Earbuds", url: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?auto=format&fit=crop&w=800&q=80" },
    { label: "GaN Charger", url: "https://images.unsplash.com/photo-1583863788434-e58a36330cf0?auto=format&fit=crop&w=800&q=80" },
    { label: "Phone Case", url: "https://images.unsplash.com/photo-1580910051074-3eb694886505?auto=format&fit=crop&w=800&q=80" },
    { label: "Gimbal", url: "https://images.unsplash.com/photo-1512499617640-c74ae3a79d37?auto=format&fit=crop&w=800&q=80" },
    { label: "Keyboard", url: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=800&q=80" }
  ];

  const categories = [
    "All",
    "Mobile Accessories",
    "Smartwatches",
    "Earbuds",
    "Chargers",
    "Tech Gadgets"
  ];

  // Filtered Products
  const filteredProducts = products.filter(p => {
    const matchesCategory = categoryFilter === "All" || p.category === categoryFilter;
    const matchesSearch = p.title.toLowerCase().includes(searchFilter.toLowerCase()) ||
                          p.category.toLowerCase().includes(searchFilter.toLowerCase());
    return matchesCategory && matchesSearch;
  });

  const handleOpenAdd = () => {
    setFormData(defaultForm);
    setFormErrors({});
    setIsAddModalOpen(true);
  };

  const handleOpenEdit = (product) => {
    setEditingProduct(product);
    
    // Convert specs object to string
    const specsStr = product.specs 
      ? Object.entries(product.specs).map(([k, v]) => `${k}: ${v}`).join(", ")
      : "";
    
    const highlightsStr = product.highlights 
      ? product.highlights.join(", ")
      : "";

    setFormData({
      title: product.title,
      category: product.category,
      price: product.price,
      originalPrice: product.originalPrice || product.price,
      stock: product.stock,
      badge: product.badge || "",
      image: product.image,
      shortDesc: product.shortDesc || "",
      specsStr,
      highlightsStr
    });
    setFormErrors({});
  };

  const validateForm = () => {
    const errs = {};
    if (!formData.title.trim()) errs.title = "Product title is required";
    if (!formData.price || Number(formData.price) <= 0) errs.price = "Valid price in BDT is required";
    if (formData.stock === "" || Number(formData.stock) < 0) errs.stock = "Valid stock count is required";
    if (!formData.image.trim()) errs.image = "Product image URL is required";
    if (!formData.shortDesc.trim()) errs.shortDesc = "Description is required";

    setFormErrors(errs);
    return Object.keys(errs).length === 0;
  };

  const handleSaveProduct = (e) => {
    e.preventDefault();
    if (!validateForm()) return;

    // Parse specs string into object
    const specsObj = {};
    if (formData.specsStr) {
      formData.specsStr.split(',').forEach(item => {
        const parts = item.split(':');
        if (parts.length >= 2) {
          specsObj[parts[0].trim()] = parts.slice(1).join(':').trim();
        }
      });
    }

    // Parse highlights
    const highlightsArr = formData.highlightsStr
      ? formData.highlightsStr.split(',').map(s => s.trim()).filter(Boolean)
      : ["Official Brand Warranty", "Tested for Performance"];

    if (editingProduct) {
      // Update existing
      const updated = {
        ...editingProduct,
        title: formData.title,
        category: formData.category,
        price: Number(formData.price),
        originalPrice: Number(formData.originalPrice || formData.price),
        stock: Number(formData.stock),
        badge: formData.badge,
        image: formData.image,
        gallery: [formData.image],
        shortDesc: formData.shortDesc,
        specs: Object.keys(specsObj).length > 0 ? specsObj : editingProduct.specs,
        highlights: highlightsArr.length > 0 ? highlightsArr : editingProduct.highlights
      };
      onEditProduct(updated);
      setEditingProduct(null);
    } else {
      // Create new
      const newProd = {
        id: `prod-${Date.now()}`,
        title: formData.title,
        category: formData.category,
        price: Number(formData.price),
        originalPrice: Number(formData.originalPrice || formData.price),
        rating: 5.0,
        reviewsCount: 1,
        stock: Number(formData.stock),
        badge: formData.badge,
        image: formData.image,
        gallery: [formData.image],
        shortDesc: formData.shortDesc,
        specs: Object.keys(specsObj).length > 0 ? specsObj : {
          "Warranty": "1 Year Official Warranty",
          "Condition": "Brand New Authentic"
        },
        highlights: highlightsArr
      };
      onAddProduct(newProd);
      setIsAddModalOpen(false);
    }
  };

  const confirmDelete = () => {
    if (deletingProductId) {
      onDeleteProduct(deletingProductId);
      setDeletingProductId(null);
    }
  };

  return (
    <div className="space-y-6 animate-fade-in">
      {/* Top Header & Search Bar */}
      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h2 className="text-xl font-bold text-white">Product Inventory Management</h2>
          <p className="text-xs text-slate-400">Total {products.length} gadget items registered in catalog</p>
        </div>

        <button
          onClick={handleOpenAdd}
          className="px-4 py-2.5 rounded-xl btn-liquid-cyan text-xs font-bold flex items-center gap-2 shadow-lg"
        >
          <Icons.Plus className="w-4 h-4 text-slate-950" />
          <span>Add New Gadget</span>
        </button>
      </div>

      {/* Filter Toolbar */}
      <div className="glass-panel p-4 rounded-2xl border border-white/10 flex flex-wrap gap-4 items-center justify-between">
        <div className="flex-1 min-w-[200px] relative">
          <input
            type="text"
            placeholder="Search products by title or category..."
            value={searchFilter}
            onChange={(e) => setSearchFilter(e.target.value)}
            className="w-full pl-9 pr-4 py-2 rounded-xl glass-input text-xs"
          />
          <Icons.Search className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
        </div>

        <div className="flex items-center gap-2">
          <span className="text-xs text-slate-400 font-medium">Category:</span>
          <select
            value={categoryFilter}
            onChange={(e) => setCategoryFilter(e.target.value)}
            className="glass-input px-3 py-2 rounded-xl text-xs"
          >
            {categories.map(cat => (
              <option key={cat} value={cat} className="bg-slate-900">{cat}</option>
            ))}
          </select>
        </div>
      </div>

      {/* Products Data Table */}
      <div className="glass-panel rounded-2xl border border-white/10 overflow-hidden shadow-xl">
        <div className="overflow-x-auto">
          <table className="w-full text-left text-xs">
            <thead className="bg-white/5 border-b border-white/10 text-slate-400 uppercase tracking-wider text-[11px] font-semibold">
              <tr>
                <th className="py-3.5 px-4">Gadget Item</th>
                <th className="py-3.5 px-4">Category</th>
                <th className="py-3.5 px-4">Price (৳)</th>
                <th className="py-3.5 px-4">Stock Status</th>
                <th className="py-3.5 px-4">Badge</th>
                <th className="py-3.5 px-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-white/5 text-slate-300">
              {filteredProducts.length === 0 ? (
                <tr>
                  <td colSpan="6" className="py-8 text-center text-slate-400">
                    No gadget items found matching criteria.
                  </td>
                </tr>
              ) : (
                filteredProducts.map((p) => {
                  const isLow = p.stock <= 5;
                  const isOut = p.stock <= 0;

                  return (
                    <tr key={p.id} className="hover:bg-white/[0.02] transition-colors">
                      {/* Item Info */}
                      <td className="py-3 px-4">
                        <div className="flex items-center gap-3">
                          <img src={p.image} alt={p.title} className="w-11 h-11 object-cover rounded-lg border border-white/10 bg-slate-900 shrink-0" />
                          <div className="min-w-0 max-w-xs">
                            <h4 className="font-bold text-white truncate text-xs">{p.title}</h4>
                            <span className="text-[10px] text-slate-500 font-mono">ID: {p.id}</span>
                          </div>
                        </div>
                      </td>

                      {/* Category */}
                      <td className="py-3 px-4 font-medium text-slate-400">
                        {p.category}
                      </td>

                      {/* Price */}
                      <td className="py-3 px-4">
                        <span className="font-mono font-bold text-cyan-400">৳{p.price.toLocaleString()}</span>
                        {p.originalPrice > p.price && (
                          <div className="text-[10px] text-slate-500 line-through">৳{p.originalPrice.toLocaleString()}</div>
                        )}
                      </td>

                      {/* Stock with quick buttons */}
                      <td className="py-3 px-4">
                        <div className="flex items-center gap-2">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                            isOut ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' :
                            isLow ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                            'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                          }`}>
                            {isOut ? 'Out of Stock' : `${p.stock} In Stock`}
                          </span>

                          {/* Inline Stock Adjustment Controls */}
                          <div className="flex items-center border border-white/10 rounded-lg bg-black/40">
                            <button
                              onClick={() => onUpdateStock(p.id, Math.max(0, p.stock - 1))}
                              className="px-1.5 py-0.5 text-slate-400 hover:text-white text-xs"
                              title="Decrease stock by 1"
                            >
                              -
                            </button>
                            <span className="px-1 text-[10px] font-mono text-white">{p.stock}</span>

                              onClick={() => onUpdateStock(p.id, p.stock + 1)}

                              +
                            </button>
                          </div>
                        </div>
                      </td>

                      {/* Badge */}
                      <td className="py-3 px-4">
                        {p.badge ? (
                          <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-purple-500/20 text-purple-300 border border-purple-500/30">
                            {p.badge}
                          </span>
                        ) : (
                          <span className="text-slate-600">-</span>
                        )}
                      </td>

                      {/* Actions */}
                      <td className="py-3 px-4 text-right">
                        <div className="flex items-center justify-end gap-1.5">

                            onClick={() => handleOpenEdit(p)}
                            className="p-1.5 rounded-lg bg-white/5 hover:bg-cyan-500/20 text-slate-300 hover:text-cyan-300 border border-white/10 transition-colors"
                            title="Edit product"
                          >
                            <Icons.Edit3 className="w-4 h-4" />
                          </button>
                          <button
                            onClick={() => setDeletingProductId(p.id)}
                            className="p-1.5 rounded-lg bg-white/5 hover:bg-rose-500/20 text-slate-300 hover:text-rose-400 border border-white/10 transition-colors"
                            title="Delete product"
                          >
                            <Icons.Trash2 className="w-4 h-4" />
                          </button>
                        </div>
                      </td>

                  );
                })
              )}

      {/* Add / Edit Product Modal */}
      {(isAddModalOpen || editingProduct) && (

            className="relative w-full max-w-2xl glass-panel-deep rounded-3xl border border-white/15 p-6 sm:p-8 shadow-2xl animate-modal-pop overflow-hidden"
            onClick={(e) => e.stopPropagation()}
          >

            <button
              onClick={() => {
                setIsAddModalOpen(false);

                </div>
              </div>

              {/* Price, Original Price, Stock */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">

                    type="number"
                    value={formData.price}
                    onChange={(e) => setFormData({ ...formData, price: e.target.value })}

                    className={`w-full px-3 py-2 rounded-xl glass-input text-xs font-mono ${formErrors.price ? 'border-rose-500' : ''}`}

                    value={formData.originalPrice}

// Admin Dashboard Portal Container
window.FS = window.FS || {};

window.FS.AdminDashboard = function AdminDashboard({
  currentUser,
  onLogout,
  onReturnToStorefront,
  products,
  orders,
  onAddProduct,
  onEditProduct,
  onDeleteProduct,
  onUpdateStock,
  onUpdateOrderStatus,
  onDeleteOrder,
  onResetDemoData
}) {
  const { Icons, ProductCRUD, OrderManagement } = window.FS;
  const { useState, useMemo } = React;

  const [activeTab, setActiveTab] = useState("overview"); // overview, products, orders, customers

  // Derived Analytics Metrics
  const analytics = useMemo(() => {
    const validOrders = orders.filter(o => o.status !== 'Cancelled');
    const totalSales = validOrders.reduce((acc, o) => acc + o.total, 0);
    const totalOrders = orders.length;
    const pendingOrders = orders.filter(o => o.status === 'Pending').length;
    const processingOrders = orders.filter(o => o.status === 'Processing').length;
    const completedOrders = orders.filter(o => o.status === 'Completed').length;
    const totalProducts = products.length;
    const lowStockProducts = products.filter(p => p.stock <= 5).length;
    
    // Unique Customers
    const customerMap = {};
    orders.forEach(o => {
      const key = o.customer.phone || o.customer.name;
      if (!customerMap[key]) {
        customerMap[key] = {
          name: o.customer.name,
          phone: o.customer.phone,
          email: o.customer.email,
          city: o.customer.city,
          address: o.customer.address,
          totalOrders: 1,
          totalSpent: o.status !== 'Cancelled' ? o.total : 0,
          lastOrderDate: o.date
        };
      } else {
        customerMap[key].totalOrders += 1;
        if (o.status !== 'Cancelled') {
          customerMap[key].totalSpent += o.total;
        }
      }
    });

    const customersList = Object.values(customerMap);

    return {
      totalSales,
      totalOrders,
      pendingOrders,
      processingOrders,
      completedOrders,
      totalProducts,
      lowStockProducts,
      totalCustomers: customersList.length,
      customersList
    };
  }, [orders, products]);

  // Top selling gadget calculation
  const topGadgets = useMemo(() => {
    const itemSales = {};
    orders.forEach(o => {
      if (o.status !== 'Cancelled') {
        o.items.forEach(it => {
          if (!itemSales[it.id]) {
            itemSales[it.id] = { ...it, unitsSold: it.quantity, revenue: it.price * it.quantity };
          } else {
            itemSales[it.id].unitsSold += it.quantity;
            itemSales[it.id].revenue += it.price * it.quantity;
          }
        });
      }
    });
    return Object.values(itemSales).sort((a, b) => b.revenue - a.revenue).slice(0, 5);
  }, [orders]);

  return (
    <div className="min-h-screen bg-[#070913] text-slate-100 flex flex-col relative z-10">
      
      {/* Top Admin Navigation Header */}
      <header className="glass-nav sticky top-0 z-40 border-b border-white/10 px-4 sm:px-8 py-3.5 flex items-center justify-between">
        <div className="flex items-center gap-3">
          <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-purple-500 to-cyan-400 p-0.5 flex items-center justify-center">
            <div className="w-full h-full bg-[#080d1c] rounded-[10px] flex items-center justify-center">
              <Icons.LayoutDashboard className="w-5 h-5 text-cyan-400" />
            </div>
          </div>
